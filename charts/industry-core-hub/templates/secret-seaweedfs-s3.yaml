{{- if and .Values.backend.enabled (and (eq .Values.backend.configuration.provider.submodel_dispatcher.mode "s3") .Values.backend.configuration.provider.submodel_dispatcher.s3.auth.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-seaweedfs-s3-credentials
  labels:
    {{- include "industry-core-hub.backend.labels" . | nindent 4 }}
type: Opaque
data:
  access-key-id: {{ .Values.backend.configuration.provider.submodel_dispatcher.s3.auth.aws_access_key_id | b64enc }}
  secret-access-key: {{ .Values.backend.configuration.provider.submodel_dispatcher.s3.auth.aws_secret_access_key | b64enc }}
{{- end }}
