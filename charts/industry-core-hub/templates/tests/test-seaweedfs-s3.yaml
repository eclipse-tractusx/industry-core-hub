{{- if and .Values.seaweedfs.enabled .Values.backend.configuration.provider.submodel_dispatcher.s3.auth.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-seaweedfs-s3-test
  labels:
    {{- include "industry-core-hub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: seaweedfs-s3-smoke-test
      image: amazon/aws-cli:2.17.62
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-seaweedfs-s3-credentials
              key: access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-seaweedfs-s3-credentials
              key: secret-access-key
        - name: AWS_DEFAULT_REGION
          value: {{ .Values.backend.configuration.provider.submodel_dispatcher.s3.region_name | quote }}
        - name: S3_ENDPOINT_URL
          value: {{ .Values.backend.configuration.provider.submodel_dispatcher.s3.endpoint_url | quote }}
        - name: S3_BUCKET_NAME
          value: {{ printf "%s-helm-test" .Values.backend.configuration.provider.submodel_dispatcher.s3.bucket_name | quote }}
      command:
        - "/bin/bash"
        - "-euo"
        - "pipefail"
        - "-c"
        - |
          echo "Waiting for SeaweedFS S3 gateway at ${S3_ENDPOINT_URL} ..."
          for i in $(seq 1 60); do
            if aws --endpoint-url "${S3_ENDPOINT_URL}" s3 ls >/dev/null 2>&1; then
              echo "SeaweedFS S3 gateway is reachable."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "SeaweedFS S3 gateway did not become reachable in time." >&2
              exit 1
            fi
            sleep 2
          done

          echo "Creating bucket ${S3_BUCKET_NAME} ..."
          aws --endpoint-url "${S3_ENDPOINT_URL}" s3 mb "s3://${S3_BUCKET_NAME}"

          echo "Uploading test object ..."
          echo -n "industry-core-hub-seaweedfs-helm-test" > /tmp/upload.txt
          aws --endpoint-url "${S3_ENDPOINT_URL}" s3 cp /tmp/upload.txt "s3://${S3_BUCKET_NAME}/helm-test/object.txt"

          echo "Downloading test object ..."
          aws --endpoint-url "${S3_ENDPOINT_URL}" s3 cp "s3://${S3_BUCKET_NAME}/helm-test/object.txt" /tmp/download.txt

          echo "Validating content ..."
          if ! diff -q /tmp/upload.txt /tmp/download.txt; then
            echo "Downloaded content does not match uploaded content." >&2
            exit 1
          fi

          echo "Deleting test object ..."
          aws --endpoint-url "${S3_ENDPOINT_URL}" s3 rm "s3://${S3_BUCKET_NAME}/helm-test/object.txt"

          echo "Verifying object deletion ..."
          if aws --endpoint-url "${S3_ENDPOINT_URL}" s3api head-object --bucket "${S3_BUCKET_NAME}" --key "helm-test/object.txt" >/dev/null 2>&1; then
            echo "Object still exists after deletion." >&2
            exit 1
          fi

          echo "Cleaning up bucket ${S3_BUCKET_NAME} ..."
          aws --endpoint-url "${S3_ENDPOINT_URL}" s3 rb "s3://${S3_BUCKET_NAME}" --force

          echo "SeaweedFS S3 smoke test passed."
{{- end }}
