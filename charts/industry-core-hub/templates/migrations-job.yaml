{{- if and .Values.backend.enabled .Values.backend.jobs.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "industry-core-hub.fullname" . }}-migrations
  labels:
    {{- include "industry-core-hub.backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.backend.jobs.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "industry-core-hub.backend.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: {{ .Values.backend.jobs.migrations.restartPolicy }}
      automountServiceAccountToken: false
      {{- with .Values.backend.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgresql
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          image: "{{ .Values.backend.jobs.migrations.postgresClientImage.registry }}/{{ .Values.backend.jobs.migrations.postgresClientImage.repository }}:{{ .Values.backend.jobs.migrations.postgresClientImage.tag }}"
          imagePullPolicy: {{ .Values.backend.jobs.migrations.postgresClientImage.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              attempts=0
              until PGPASSWORD="$PGPASSWORD" psql --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" --dbname="$PGDATABASE" --command="SELECT 1" >/dev/null 2>&1; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge "$PGWAIT_ATTEMPTS" ]; then
                  echo "PostgreSQL was not ready after $PGWAIT_ATTEMPTS attempts"
                  exit 1
                fi
                echo "Waiting for PostgreSQL ($attempts/$PGWAIT_ATTEMPTS)"
                sleep "$PGWAIT_DELAY"
              done
              echo "PostgreSQL is ready"
          env:
            - name: PGHOST
              value: {{ include "industry-core-hub.postgresql.host" . | quote }}
            - name: PGPORT
              value: {{ include "industry-core-hub.postgresql.port" . | quote }}
            - name: PGDATABASE
              value: {{ include "industry-core-hub.postgresql.databaseName" . | quote }}
            - name: PGUSER
              value: {{ include "industry-core-hub.postgresql.ichubUser" . | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "industry-core-hub.postgresql.secretName" . }}
                  key: {{ include "industry-core-hub.postgresql.ichub.secretKey" . }}
            - name: PGSSLMODE
              value: {{ include "industry-core-hub.postgresql.sslMode" . | quote }}
            - name: PGCONNECT_TIMEOUT
              value: "2"
            - name: PGWAIT_ATTEMPTS
              value: {{ .Values.backend.jobs.migrations.readiness.attempts | quote }}
            - name: PGWAIT_DELAY
              value: {{ .Values.backend.jobs.migrations.readiness.delaySeconds | quote }}
      containers:
        - name: migrations
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python"]
          args: ["migrate.py", "upgrade", "head"]
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "industry-core-hub.postgresql.secretName" . }}
                  key: {{ include "industry-core-hub.postgresql.ichub.secretKey" . }}
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.jobs.migrations.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /industry-core-hub/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
{{- end }}