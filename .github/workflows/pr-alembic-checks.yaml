name: Alembic Migration Checks

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: user
  PGPASSWORD: password
  PGDATABASE: ichub
  DATABASE_PASSWORD: password

jobs:
  alembic-checks:
    name: Alembic Migration Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ichub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d ichub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: ichub-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create cache schema (Infrastructure Provisioning)
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U user -d ichub -c "CREATE SCHEMA IF NOT EXISTS cache;"

      - name: Apply Alembic migrations
        working-directory: ichub-backend
        run: alembic upgrade head

      - name: Check Alembic metadata
        working-directory: ichub-backend
        run: alembic check
