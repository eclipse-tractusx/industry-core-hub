name: "Eclipse DASH IP Check"

on:
  push:
    branches: [main]
    paths:
      - ichub-backend/requirements.txt
      - DEPENDENCIES_ICHUB-BACKEND
      - .github/workflows/dependencies-backend.yml
  pull_request:
    branches: [main]
    paths:
      - ichub-backend/requirements.txt
      - DEPENDENCIES_ICHUB-BACKEND
      - .github/workflows/dependencies-backend.yml
  workflow_dispatch:
    inputs:
      use_ip_check:
        description: 'Submit IP check requests to Eclipse DASH (requires ECLIPSE_DASH_TOKEN secret)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  check-dependencies-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Create and activate virtual environment
        run: |
          python -m venv ichub-backend/venv
          source ichub-backend/venv/bin/activate
          echo "VIRTUAL_ENV=ichub-backend/venv" >> $GITHUB_ENV
          echo "PATH=ichub-backend/venv/bin:$PATH" >> $GITHUB_ENV

      - name: Install dependencies in isolated environment
        run: |
          source ichub-backend/venv/bin/activate
          if [ -f ichub-backend/requirements.txt ]; then
            pip install -r ichub-backend/requirements.txt
          else
            echo "No requirements.txt found in ichub-backend, skipping..."
          fi

      - name: List packages
        run: |
          source ichub-backend/venv/bin/activate
          pip list --format=freeze | awk -F'==' '{print "pypi/pypi/-/" $1 "/" $2}' | awk '!seen[$0]++' > ichub-backend/PACKAGE

      - name: Generate Dependencies file
        env:
          ECLIPSE_DASH_TOKEN: ${{ secrets.ECLIPSE_DASH_TOKEN }}
        run: |
          curl -L --output ./org.eclipse.dash.licenses.jar 'https://repo.eclipse.org/service/rest/v1/search/assets/download?repository=dash-maven2-releases&maven.groupId=org.eclipse.dash&maven.artifactId=org.eclipse.dash.licenses&maven.baseVersion=1.1.0&maven.extension=jar'

          DASH_ARGS="ichub-backend/PACKAGE -project automotive.tractusx -summary DEPENDENCIES_ICHUB-BACKEND"
          if [[ -n "$ECLIPSE_DASH_TOKEN" ]]; then
            DASH_ARGS="$DASH_ARGS -token $ECLIPSE_DASH_TOKEN"
          elif [[ "${{ inputs.use_ip_check }}" == "true" ]]; then
            echo "IP check requested via workflow_dispatch but ECLIPSE_DASH_TOKEN is not set"
          fi

          java -jar ./org.eclipse.dash.licenses.jar $DASH_ARGS || true

      - name: Commit updated DEPENDENCIES_ICHUB-BACKEND
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DEPENDENCIES_ICHUB-BACKEND
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(deps): update DEPENDENCIES_ICHUB-BACKEND [skip ci]"
            git push
          fi

      - name: Commit updated DEPENDENCIES_ICHUB-BACKEND to PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DEPENDENCIES_ICHUB-BACKEND
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(deps): update DEPENDENCIES_ICHUB-BACKEND [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:${{ github.head_ref }}; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push updated dependency file after 3 attempts."
                exit 1
              fi
              git fetch origin "${{ github.head_ref }}"
              git rebase "origin/${{ github.head_ref }}"
            done
          fi

      - name: Check for restricted dependencies
        run: |
          restricted=$(grep 'restricted' DEPENDENCIES_ICHUB-BACKEND || true)
          if [[ -n "$restricted" ]]; then
            echo "The following dependencies are restricted: $restricted"
            exit 1
          fi
