---
name: "Deployment Tests"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  ichub-deployment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # this will verify that the official distribution of the Tractus-X Industry Core Helm chart runs on the last 3 Kubernetes versions
      matrix:
        k8s-version: [ "v1.34.0",
                       "v1.33.4",
                       "v1.32.8" ]
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      
      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: '3.14.0'
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: 'latest'
      
      - name: Create KinD cluster with registry
        uses: container-tools/kind-action@0ad70e2299366b0e1552c7240f4e4567148f723e # v2.0.4
        with:
          version: v0.27.0
          node_image: kindest/node:${{ matrix.k8s-version }}
          cluster_name: ichub-test-cluster
          wait: 300s
          registry: true
      
      - name: Build and load backend image
        run: |
          docker build -f ./ichub-backend/runtimes/Dockerfile -t kind-registry:5000/ichub-backend:test ./ichub-backend
          kind load docker-image kind-registry:5000/ichub-backend:test --name ichub-test-cluster
        env:
          KIND_EXPERIMENTAL_CONTAINERD_SNAPSHOTTER: overlayfs

      - name: Build and load frontend image
        run: |
          docker build -t kind-registry:5000/ichub-frontend:test ./ichub-frontend
          kind load docker-image kind-registry:5000/ichub-frontend:test --name ichub-test-cluster
        env:
          KIND_EXPERIMENTAL_CONTAINERD_SNAPSHOTTER: overlayfs

      - name: Wait for cluster to be ready
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
      
      - name: Run deployment test using KinD and Helm
        run: |
          # Install Industry Core Hub chart with locally built images from KinD registry
          helm install tx-ichub charts/industry-core-hub \
           -f charts/test-helm-values-ichub.yaml \
           --set backend.image.repository=kind-registry:5000/ichub-backend \
           --set backend.image.tag=test \
           --set backend.image.pullPolicy=IfNotPresent \
           --set frontend.image.repository=kind-registry:5000/ichub-frontend \
           --set frontend.image.tag=test \
           --set frontend.image.pullPolicy=IfNotPresent \
           --dependency-update \
           --wait --timeout=600s

          # Helm waits for the post-install migration hook to complete.
          
          # Debug: Show all resources created
          echo "=== All resources created ==="
          kubectl get all -l app.kubernetes.io/instance=tx-ichub
          
          echo "=== All deployments ==="
          kubectl get deployments -l app.kubernetes.io/instance=tx-ichub
          
          # Wait for deployments to be ready (using correct naming pattern)
          kubectl wait --for=condition=available --timeout=300s deployment -l app.kubernetes.io/instance=tx-ichub,app.kubernetes.io/component=backend || true
          kubectl wait --for=condition=available --timeout=300s deployment -l app.kubernetes.io/instance=tx-ichub,app.kubernetes.io/component=frontend || true
          
          # Check deployment status using labels
          kubectl get deployments -l app.kubernetes.io/instance=tx-ichub -o name | while read deployment; do
            echo "Checking rollout status for $deployment"
            kubectl rollout status "$deployment" --timeout=300s
          done

      - name: Debug failed Helm installation
        if: failure()
        run: |
          echo "=== Jobs ==="
          kubectl get jobs -l app.kubernetes.io/instance=tx-ichub -o wide || true

          migration_job=$(kubectl get jobs \
            -l app.kubernetes.io/instance=tx-ichub,app.kubernetes.io/component=migrations \
            -o jsonpath='{.items[0].metadata.name}')

          if [ -n "$migration_job" ]; then
            echo "=== Migration job description ==="
            kubectl describe job "$migration_job" || true

            echo "=== Migration pod status ==="
            kubectl get pods -l job-name="$migration_job" -o wide || true

            migration_pod=$(kubectl get pods \
              -l job-name="$migration_job" \
              -o jsonpath='{.items[0].metadata.name}' || true)

            if [ -n "$migration_pod" ]; then
              echo "=== Migration pod: $migration_pod ==="
              kubectl describe pod "$migration_pod" || true

              echo "=== Previous migration container logs ==="
              kubectl logs "$migration_pod" -c migrations --previous --timestamps || true

              echo "=== Current migration container logs ==="
              kubectl logs "$migration_pod" -c migrations --timestamps || true

              echo "=== PostgreSQL readiness logs ==="
              kubectl logs "$migration_pod" -c wait-for-postgresql --timestamps || true
            else
              echo "Migration pod was not found"
            fi

            echo "=== Migration pod description ==="
            kubectl describe pods -l job-name="$migration_job" || true
          else
            echo "Migration job was not found"
          fi

          echo "=== Kubernetes events ==="
          kubectl get events --sort-by=.lastTimestamp || true
