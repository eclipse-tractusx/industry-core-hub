name: Check Frontend Dependencies

on:
  push:
    branches: [main]
    paths:
      - ichub-frontend/package-lock.json
      - DEPENDENCIES_ICHUB-FRONTEND
      - .github/workflows/dependencies-frontend.yaml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ichub-frontend/package-lock.json
      - DEPENDENCIES_ICHUB-FRONTEND
      - .github/workflows/dependencies-frontend.yaml
  workflow_dispatch:
    inputs:
      use_ip_check:
        description: 'Submit IP check requests to Eclipse DASH (requires ECLIPSE_DASH_TOKEN secret)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate Dependencies file
        env:
          ECLIPSE_DASH_TOKEN: ${{ secrets.ECLIPSE_DASH_TOKEN }}
        run: |
          curl -L --output ./dash.jar 'https://repo.eclipse.org/service/rest/v1/search/assets/download?repository=dash-maven2-releases&maven.groupId=org.eclipse.dash&maven.artifactId=org.eclipse.dash.licenses&maven.baseVersion=1.1.0&maven.extension=jar'

          DASH_ARGS="ichub-frontend/package-lock.json -project automotive.tractusx -summary DEPENDENCIES_ICHUB-FRONTEND"
          if [[ -n "$ECLIPSE_DASH_TOKEN" ]]; then
            DASH_ARGS="$DASH_ARGS -token $ECLIPSE_DASH_TOKEN"
          elif [[ "${{ inputs.use_ip_check }}" == "true" ]]; then
            echo "IP check requested via workflow_dispatch but ECLIPSE_DASH_TOKEN is not set"
          fi

          java -jar ./dash.jar $DASH_ARGS || true

      - name: Commit updated DEPENDENCIES_ICHUB-FRONTEND
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DEPENDENCIES_ICHUB-FRONTEND
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(deps): update DEPENDENCIES_ICHUB-FRONTEND [skip ci]"
            git push
          fi

      - name: Commit updated DEPENDENCIES_ICHUB-FRONTEND to PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DEPENDENCIES_ICHUB-FRONTEND
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(deps): update DEPENDENCIES_ICHUB-FRONTEND [skip ci]"
            git push --force-with-lease origin HEAD:${{ github.head_ref }}
          fi

      - name: Check for restricted dependencies
        run: |
          restricted=$(grep ' restricted,' DEPENDENCIES_ICHUB-FRONTEND || true)
          if [[ -n "$restricted" ]]; then
            echo "The following dependencies are restricted: $restricted"
            exit 1
          fi